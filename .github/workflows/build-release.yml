name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: Linux
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: SnakeProGo
            
          - os: macOS (ARM)
            runs-on: macos-14
            goos: darwin
            goarch: arm64
            artifact: SnakeProGo
            
          - os: Windows
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            artifact: SnakeProGo.exe

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Install dependencies (Linux)
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config
      
      - name: Build for ${{ matrix.os }}
        working-directory: ./src
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ${{ matrix.artifact }} cmd/main.go
      
      - name: Create artifact directory
        run: |
          mkdir -p artifacts
          mv src/${{ matrix.artifact }} artifacts/
      
      - name: Create zip archive (Linux/macOS)
        if: matrix.goos != 'windows'
        run: |
          cd artifacts
          zip -r SnakeProGo-${{ matrix.goos }}-${{ matrix.goarch }}.zip SnakeProGo
      
      - name: Create zip archive (Windows)
        if: matrix.goos == 'windows'
        run: |
          cd artifacts
          powershell Compress-Archive -Path SnakeProGo.exe -DestinationPath SnakeProGo-windows-amd64.zip
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnakeProGo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/SnakeProGo-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Flatten artifact structure
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec mv {} release/ \;
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
